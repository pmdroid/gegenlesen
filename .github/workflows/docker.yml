# Linux images only. macOS binaries are built and Developer ID-signed on a Mac:
#   ./scripts/release-darwin.sh v0.1.0 --upload
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/pmdroid/gegenlesen
  RUNNER_IMAGE: ghcr.io/pmdroid/gegenlesen/runner

jobs:
  api:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sidecar images baked into the API
        id: sidecars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "runner=${API_IMAGE}:runner-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "claude=${API_IMAGE}:claude-runner-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "codex=${API_IMAGE}:codex-runner-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "cursor=${API_IMAGE}:cursor-runner-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "scanner=${API_IMAGE}:scanner-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "runner=${API_IMAGE}:runner-main" >> "$GITHUB_OUTPUT"
            echo "claude=${API_IMAGE}:claude-runner-main" >> "$GITHUB_OUTPUT"
            echo "codex=${API_IMAGE}:codex-runner-main" >> "$GITHUB_OUTPUT"
            echo "cursor=${API_IMAGE}:cursor-runner-main" >> "$GITHUB_OUTPUT"
            echo "scanner=${API_IMAGE}:scanner-main" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.API_IMAGE }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GEGENLESEN_OPENCODE_IMAGE=${{ steps.sidecars.outputs.runner }}
            GEGENLESEN_CLAUDE_RUNNER_IMAGE=${{ steps.sidecars.outputs.claude }}
            GEGENLESEN_CODEX_RUNNER_IMAGE=${{ steps.sidecars.outputs.codex }}
            GEGENLESEN_CURSOR_RUNNER_IMAGE=${{ steps.sidecars.outputs.cursor }}
            GEGENLESEN_SCANNER_IMAGE=${{ steps.sidecars.outputs.scanner }}
          outputs: type=image,name=${{ env.API_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: api-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  api-merge:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: api-digests-*
          merge-multiple: true

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.API_IMAGE }}@sha256:%s ' *)

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.RUNNER_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/metadata-action@v5
        id: alias
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=runner-main,enable={{is_default_branch}}
            type=sha,prefix=runner-main-,format=short,enable={{is_default_branch}}
            type=semver,pattern=runner-{{version}}
            type=semver,pattern=runner-{{major}}.{{minor}}
            type=raw,value=runner,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build runner-base
        uses: docker/build-push-action@v6
        with:
          context: docker/runner-base
          file: docker/runner-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pmdroid/gegenlesen/runner-base:main
          cache-from: type=gha,scope=runner-base
          cache-to: type=gha,mode=max,scope=runner-base

      - uses: docker/build-push-action@v6
        with:
          context: docker/opencode-runner
          file: docker/opencode-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/pmdroid/gegenlesen/runner-base:main
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.alias.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  claude-runner:
    runs-on: ubuntu-latest
    needs: runner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: alias
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=claude-runner-main,enable={{is_default_branch}}
            type=sha,prefix=claude-runner-main-,format=short,enable={{is_default_branch}}
            type=semver,pattern=claude-runner-{{version}}
            type=semver,pattern=claude-runner-{{major}}.{{minor}}
            type=raw,value=claude-runner,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/claude-runner
          file: docker/claude-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/pmdroid/gegenlesen/runner-base:main
          tags: ${{ steps.alias.outputs.tags }}
          labels: ${{ steps.alias.outputs.labels }}
          cache-from: type=gha,scope=claude-runner
          cache-to: type=gha,mode=max,scope=claude-runner

  codex-runner:
    runs-on: ubuntu-latest
    needs: runner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: alias
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=codex-runner-main,enable={{is_default_branch}}
            type=sha,prefix=codex-runner-main-,format=short,enable={{is_default_branch}}
            type=semver,pattern=codex-runner-{{version}}
            type=semver,pattern=codex-runner-{{major}}.{{minor}}
            type=raw,value=codex-runner,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/codex-runner
          file: docker/codex-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/pmdroid/gegenlesen/runner-base:main
          tags: ${{ steps.alias.outputs.tags }}
          labels: ${{ steps.alias.outputs.labels }}
          cache-from: type=gha,scope=codex-runner
          cache-to: type=gha,mode=max,scope=codex-runner

  cursor-runner:
    runs-on: ubuntu-latest
    needs: runner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: alias
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=cursor-runner-main,enable={{is_default_branch}}
            type=sha,prefix=cursor-runner-main-,format=short,enable={{is_default_branch}}
            type=semver,pattern=cursor-runner-{{version}}
            type=semver,pattern=cursor-runner-{{major}}.{{minor}}
            type=raw,value=cursor-runner,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/cursor-runner
          file: docker/cursor-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_BASE=ghcr.io/pmdroid/gegenlesen/runner-base:main
          tags: ${{ steps.alias.outputs.tags }}
          labels: ${{ steps.alias.outputs.labels }}
          cache-from: type=gha,scope=cursor-runner
          cache-to: type=gha,mode=max,scope=cursor-runner

  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same package as the API so anonymous pulls work (see runner job).
      - uses: docker/metadata-action@v5
        id: alias
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=scanner-main,enable={{is_default_branch}}
            type=sha,prefix=scanner-main-,format=short,enable={{is_default_branch}}
            type=semver,pattern=scanner-{{version}}
            type=semver,pattern=scanner-{{major}}.{{minor}}
            type=raw,value=scanner,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/scanner
          file: docker/scanner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.alias.outputs.tags }}
          labels: ${{ steps.alias.outputs.labels }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
