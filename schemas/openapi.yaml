openapi: 3.1.0
info:
  title: gegenlesen API
  version: 0.1.0
  description: |
    Single-tenant PR review service. No auth.
    Wire format is snake_case. See docs/technical-plan.md.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDTO"
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Non-secret config. Never includes the API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDTO"
    put:
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Saved models. Key stored on disk, not echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDTO"
        "422":
          description: Missing models or OpenRouter rejected the key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorBody"
  /api/models:
    get:
      operationId: listOpenRouterModels
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text name or slug. Forwarded to OpenRouter.
        - name: category
          in: query
          schema:
            type: string
            enum: [programming, technology, academia, science, legal, translation]
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                most-popular,
                newest,
                top-weekly,
                pricing-low-to-high,
                coding-high-to-low,
                intelligence-high-to-low,
                agentic-high-to-low,
              ]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: free
          in: query
          schema: { type: boolean }
          description: Only models with zero prompt and completion price.
        - name: X-OpenRouter-Key
          in: header
          schema: { type: string }
          description: Optional key before it is saved. Otherwise the stored key is used.
      responses:
        "200":
          description: Text models from OpenRouter. Ids are prefixed with openrouter/ for OpenCode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenRouterModelList"
        "422":
          description: Missing or rejected key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorBody"
  /api/metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text
          content:
            text/plain:
              schema:
                type: string
  /api/jobs:
    get:
      operationId: listJobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
        - name: active
          in: query
          schema: { type: boolean }
          description: If true and status is omitted, only non-terminal jobs.
        - name: repository
          in: query
          schema: { type: string }
        - name: unscoped
          in: query
          schema: { type: boolean }
          description: If true, only jobs with no repository.
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive title/id substring.
      responses:
        "200":
          description: newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
    post:
      operationId: createJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, meta]
              properties:
                archive:
                  type: string
                  format: binary
                  description: .tar or .tar.gz. Zip rejected.
                meta:
                  type: string
                  description: UTF-8 JSON CreateJobMeta
                patch:
                  type: string
                  format: binary
                  description: Unified diff or git format-patch mbox
      responses:
        "202":
          description: queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /api/repositories:
    get:
      operationId: listRepositories
      responses:
        "200":
          description: known repositories from jobs, rules, and notes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items: { type: string }
  /api/jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: full job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404": { $ref: "#/components/responses/Error" }
  /api/jobs/{id}/events:
    get:
      operationId: listJobEvents
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/JobEvent" }
        "404": { $ref: "#/components/responses/Error" }
  /api/jobs/{id}/transcript:
    get:
      operationId: getJobTranscript
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: phase
          in: query
          required: true
          schema:
            type: string
            enum: [review, review_a, review_b, judge]
      responses:
        "200":
          description: redacted NDJSON
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/jobs/{id}/feedback:
    get:
      operationId: listJobFeedback
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingFeedbackListResponse" }
        "404": { $ref: "#/components/responses/Error" }
  /api/findings/{id}/feedback:
    post:
      operationId: createFindingFeedback
      parameters:
        - $ref: "#/components/parameters/FindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingFeedbackRequest" }
      responses:
        "201":
          description: new feedback row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingFeedback" }
        "200":
          description: reused existing should_be_rule draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingFeedback" }
        "204":
          description: current reaction cleared
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/jobs/{id}/learn:
    post:
      operationId: learnFromJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MineAccepted" }
        "404": { $ref: "#/components/responses/Error" }
  /api/rules:
    get:
      operationId: listRules
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/RuleKind" }
        - name: provenance
          in: query
          schema: { $ref: "#/components/schemas/RuleProvenance" }
        - name: repository
          in: query
          schema: { type: string }
        - name: unscoped
          in: query
          schema: { type: boolean }
        - name: include_global
          in: query
          schema: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleListResponse" }
    post:
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleUpsert" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/Error" }
  /api/rules/{id}:
    get:
      operationId: getRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleUpsert" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: soft delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
  /api/rules/{id}/promote:
    post:
      operationId: promoteRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/rules/{id}/enable:
    post:
      operationId: enableRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
  /api/rules/{id}/disable:
    post:
      operationId: disableRule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "404": { $ref: "#/components/responses/Error" }
  /api/corpus:
    get:
      operationId: listCorpus
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusListResponse" }
    post:
      operationId: ingestCorpus
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [item]
              properties:
                item:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusAccepted" }
  /api/corpus/mine:
    post:
      operationId: mineCorpus
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MineRequest" }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MineAccepted" }
  /api/corpus/{id}:
    get:
      operationId: getCorpusItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusItem" }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FindingId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^fnd_" }
  responses:
    Error:
      description: error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIErrorBody" }
  schemas:
    JobStatus:
      type: string
      enum:
        - queued
        - unpacking
        - identifying
        - selecting_rules
        - deterministic
        - reviewing
        - judging
        - succeeded
        - failed
        - cancelled
    JobScope:
      type: string
      enum: [full, incremental]
    ReviewerSlot:
      type: string
      enum: [model_a, model_b]
    Severity:
      type: string
      enum: [info, warning, error]
    FindingPhase:
      type: string
      enum: [deterministic, agent]
    JudgeVerdict:
      type: string
      enum: [keep, drop, downgrade, unavailable]
    FindingLifecycle:
      type: string
      enum: [new, still_open, resolved, relocated]
    RuleKind:
      type: string
      enum: [deterministic, semantic]
    RuleProvenance:
      type: string
      enum: [handwritten, mined, suggested]
    EventLevel:
      type: string
      enum: [debug, info, warning, error]
    FeedbackVerdict:
      type: string
      enum: [agree, disagree, comment, should_be_rule]
    FeedbackReaction:
      type: string
      enum: [thumbs_up, thumbs_down]
    ErrorCode:
      type: string
      enum:
        - bad_request
        - not_found
        - conflict
        - payload_too_large
        - unsupported_media_type
        - unprocessable
        - insufficient_storage
        - internal
    HealthDTO:
      type: object
      additionalProperties: false
      required: [ok, version]
      properties:
        ok: { type: boolean, const: true }
        version: { type: string }
    Limits:
      type: object
      additionalProperties: false
      required:
        - archive_bytes
        - queued_archive_bytes
        - agent_timeout_sec
        - judge_timeout_sec
        - deterministic_timeout_sec
        - identify_timeout_sec
        - rule_token_budget
      properties:
        archive_bytes: { type: integer }
        queued_archive_bytes: { type: integer }
        agent_timeout_sec: { type: integer }
        judge_timeout_sec: { type: integer }
        deterministic_timeout_sec: { type: integer }
        identify_timeout_sec: { type: integer }
        rule_token_budget: { type: integer }
        learn_interval_minutes: { type: integer, minimum: 0, description: "0 disables. Else learn jobs with new feedback at most this often." }
        scanner_timeout_sec: { type: integer, minimum: 1, description: "Wall clock for the scanner container. Default 120." }
    ModelSlots:
      type: object
      additionalProperties: false
      required: [model_a, model_b]
      properties:
        model_a: { type: string }
        model_b: { type: string }
    SettingsDTO:
      type: object
      additionalProperties: false
      required: [bind, port, models, judge_model, opencode_image, limits, openrouter_configured]
      properties:
        bind: { type: string }
        port: { type: integer }
        models: { $ref: "#/components/schemas/ModelSlots" }
        judge_model: { type: string }
        opencode_image: { type: string }
        scanner_image: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        openrouter_configured: { type: boolean }
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        models: { $ref: "#/components/schemas/ModelSlots" }
        judge_model: { type: string }
        openrouter_api_key: { type: string }
        scanner_image: { type: string, description: "Empty string skips the scanner container." }
    OpenRouterModel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        context_length: { type: integer, nullable: true }
        prompt_price: { type: string, nullable: true }
        free: { type: boolean }
    OpenRouterModelList:
      type: object
      additionalProperties: false
      required: [models, total, free]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/OpenRouterModel" }
        total: { type: integer }
        query: { type: string, nullable: true }
        category: { type: string, nullable: true }
        sort: { type: string, nullable: true }
        free: { type: boolean }
    APIErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    JobAccepted:
      type: object
      additionalProperties: false
      required: [id, status, queue_position]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: queued }
        queue_position: { type: integer, minimum: 1 }
    JobSummary:
      type: object
      additionalProperties: false
      required: [new, still_open, resolved, relocated, dropped]
      properties:
        new: { type: integer, minimum: 0 }
        still_open: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        relocated: { type: integer, minimum: 0 }
        dropped: { type: integer, minimum: 0 }
    JobListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - scope
        - parent_job_id
        - repository
        - reviewer_a_model_id
        - reviewer_b_model_id
        - judge_model_id
        - base_sha
        - head_sha
        - queue_position
        - summary
        - created_at
        - started_at
        - finished_at
        - error_message
      properties:
        id: { type: string, format: uuid }
        title: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/JobStatus" }
        scope: { $ref: "#/components/schemas/JobScope" }
        parent_job_id: { type: ["string", "null"], format: uuid }
        repository: { type: ["string", "null"] }
        reviewer_a_model_id: { type: string }
        reviewer_b_model_id: { type: string }
        judge_model_id: { type: string }
        base_sha: { type: ["string", "null"] }
        head_sha: { type: ["string", "null"] }
        queue_position: { type: ["integer", "null"] }
        summary: { oneOf: [{ $ref: "#/components/schemas/JobSummary" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        started_at: { type: ["string", "null"], format: date-time }
        finished_at: { type: ["string", "null"], format: date-time }
        error_message: { type: ["string", "null"] }
    JobListResponse:
      type: object
      additionalProperties: false
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobListItem" }
        total: { type: integer, minimum: 0 }
    FindingFeedback:
      type: object
      additionalProperties: false
      required: [id, finding_id, job_id, ts, verdict, reaction, comment, suggested_rule_id]
      properties:
        id: { type: integer }
        finding_id: { type: string, pattern: "^fnd_" }
        job_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        verdict: { $ref: "#/components/schemas/FeedbackVerdict" }
        reaction:
          oneOf:
            - { $ref: "#/components/schemas/FeedbackReaction" }
            - { type: "null" }
        comment: { type: ["string", "null"] }
        suggested_rule_id: { type: ["string", "null"] }
    FindingFeedbackListResponse:
      type: object
      additionalProperties: false
      required: [feedback]
      properties:
        feedback:
          type: array
          items: { $ref: "#/components/schemas/FindingFeedback" }
    FindingFeedbackRequest:
      type: object
      additionalProperties: false
      properties:
        verdict: { $ref: "#/components/schemas/FeedbackVerdict" }
        reaction:
          type: string
          description: thumbs_up/+1/👍 → agree; thumbs_down/-1/👎 → disagree. Unknown emoji → 400.
        comment: { type: ["string", "null"] }
    JobEvent:
      type: object
      additionalProperties: false
      required: [id, job_id, ts, level, message]
      properties:
        id: { type: integer }
        job_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/EventLevel" }
        message: { type: string }
        payload_json: { type: ["string", "null"] }
    Finding:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - rule_id
        - phase
        - reviewer_slot
        - severity
        - title
        - message
        - file_path
        - start_line
        - end_line
        - snippet
        - agent_rationale
        - judge_verdict
        - judge_severity
        - judge_rationale
        - confidence
        - lifecycle
        - parent_finding_id
        - suggested_patch
        - evidence_ok
        - created_at
      properties:
        id: { type: string, pattern: "^fnd_" }
        job_id: { type: string, format: uuid }
        rule_id: { type: ["string", "null"] }
        phase: { $ref: "#/components/schemas/FindingPhase" }
        reviewer_slot:
          oneOf:
            - { $ref: "#/components/schemas/ReviewerSlot" }
            - { type: "null" }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string }
        message: { type: string }
        file_path: { type: ["string", "null"] }
        start_line: { type: ["integer", "null"] }
        end_line: { type: ["integer", "null"] }
        snippet: { type: ["string", "null"] }
        agent_rationale: { type: ["string", "null"] }
        judge_verdict:
          oneOf:
            - { $ref: "#/components/schemas/JudgeVerdict" }
            - { type: "null" }
        judge_severity:
          oneOf:
            - { $ref: "#/components/schemas/Severity" }
            - { type: "null" }
        judge_rationale: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        lifecycle: { $ref: "#/components/schemas/FindingLifecycle" }
        parent_finding_id: { type: ["string", "null"] }
        suggested_patch: { type: ["string", "null"] }
        evidence_ok: { type: ["boolean", "null"] }
        created_at: { type: string, format: date-time }
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobListItem"
        - type: object
          additionalProperties: false
          required: [findings, events]
          properties:
            findings:
              type: array
              items: { $ref: "#/components/schemas/Finding" }
            events:
              type: array
              items: { $ref: "#/components/schemas/JobEvent" }
    RuleExample:
      type: object
      additionalProperties: false
      required: [excerpt]
      properties:
        path: { type: ["string", "null"] }
        excerpt: { type: string }
        note: { type: ["string", "null"] }
    RulePayload:
      oneOf:
        - type: object
          additionalProperties: false
          required: [checker, pattern, message]
          properties:
            checker: { const: regex }
            pattern: { type: string }
            flags: { type: string }
            message: { type: string }
        - type: object
          additionalProperties: false
          required: [checker, symbols, message]
          properties:
            checker: { const: deny_api }
            symbols:
              type: array
              items: { type: string }
            message: { type: string }
        - type: object
          additionalProperties: false
          required: [checker, source_glob, test_template]
          properties:
            checker: { const: sibling_test }
            source_glob: { type: string }
            test_template: { type: string }
        - type: object
          additionalProperties: false
          required: [checker, argv, timeout_sec]
          properties:
            checker: { const: command }
