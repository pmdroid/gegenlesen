              type: array
              items: { type: string }
            timeout_sec: { type: integer, minimum: 1, maximum: 20 }
        - type: object
          additionalProperties: false
          required: [checker, spec_globs, message]
          properties:
            checker: { const: openapi_break }
            spec_globs:
              type: array
              items: { type: string }
            fail_on:
              type: string
              enum: [breaking, changelog]
              default: breaking
            message: { type: string }
