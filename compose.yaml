# Linux. --network host shares 127.0.0.1 with OpenCode loopback publishes.
# DATA must be the same path on the host and in the container so runner binds work.
# Mount host agent dirs so Ledger Setup sees Claude/Codex/Cursor/Grok CLI auth.
# On a Mac use ./scripts/docker-run.sh instead (port publish; no host network).
services:
  gegenlesen:
    image: ghcr.io/pmdroid/gegenlesen:main
    build: .
    init: true
    network_mode: host
    environment:
      GEGENLESEN_DATA_DIR: ${GEGENLESEN_DATA_DIR:-${HOME}/gegenlesen-data}
      GEGENLESEN_HOST_HOME: ${GEGENLESEN_HOST_HOME:-/host-home}
      GEGENLESEN_ALLOW_REMOTE: ${GEGENLESEN_ALLOW_REMOTE:-1}
      GEGENLESEN_OPENCODE_IMAGE: ${GEGENLESEN_OPENCODE_IMAGE:-ghcr.io/pmdroid/gegenlesen:runner-main}
      GEGENLESEN_CLAUDE_RUNNER_IMAGE: ${GEGENLESEN_CLAUDE_RUNNER_IMAGE:-ghcr.io/pmdroid/gegenlesen:claude-runner-main}
      GEGENLESEN_CODEX_RUNNER_IMAGE: ${GEGENLESEN_CODEX_RUNNER_IMAGE:-ghcr.io/pmdroid/gegenlesen:codex-runner-main}
      GEGENLESEN_CURSOR_RUNNER_IMAGE: ${GEGENLESEN_CURSOR_RUNNER_IMAGE:-ghcr.io/pmdroid/gegenlesen:cursor-runner-main}
      GEGENLESEN_GROK_RUNNER_IMAGE: ${GEGENLESEN_GROK_RUNNER_IMAGE:-ghcr.io/pmdroid/gegenlesen:grok-runner-main}
      GEGENLESEN_SCANNER_IMAGE: ${GEGENLESEN_SCANNER_IMAGE:-ghcr.io/pmdroid/gegenlesen:scanner-main}
      GEGENLESEN_MINE_TIMEOUT_SEC: ${GEGENLESEN_MINE_TIMEOUT_SEC:-}
      GEGENLESEN_MINER_MODEL: ${GEGENLESEN_MINER_MODEL:-}
      GEGENLESEN_LEARN_INTERVAL_MINUTES: ${GEGENLESEN_LEARN_INTERVAL_MINUTES:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_AUTH_TOKEN: ${CURSOR_AUTH_TOKEN:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GEGENLESEN_DATA_DIR:-${HOME}/gegenlesen-data}:${GEGENLESEN_DATA_DIR:-${HOME}/gegenlesen-data}
      - ${GEGENLESEN_CONFIG_DIR:-./config}:/app/config
      - ${HOME}/.claude:${GEGENLESEN_HOST_HOME:-/host-home}/.claude:ro
      - ${HOME}/.codex:${GEGENLESEN_HOST_HOME:-/host-home}/.codex:ro
      - ${HOME}/.cursor:${GEGENLESEN_HOST_HOME:-/host-home}/.cursor:ro
      - ${HOME}/.grok:${GEGENLESEN_HOST_HOME:-/host-home}/.grok:ro
      - ${HOME}/.config/cursor:${GEGENLESEN_HOST_HOME:-/host-home}/.config/cursor:ro
      - ${HOME}/.local/bin:${GEGENLESEN_HOST_HOME:-/host-home}/.local/bin:ro
