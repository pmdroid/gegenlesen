id: no-hardcoded-secrets
title: No hardcoded API keys or tokens
severity: error
enabled: true
kind: deterministic
provenance: handwritten
languages: ["*"]
path_globs:
  - "**/*"
  - "!**/*.md"
  - "!**/testdata/**"
  - "!evals/cases/**"
  - "!**/fixtures/**"
  - "!**/mocks/**"
  - "!**/__mocks__/**"
  - "!**/snapshots/**"
  - "!examples/**"
  - "!**/examples/**"
  - "!**/example/**"
  - "!**/*.snap"
payload:
  checker: regex
  pattern: "(?i)(api[_-]?key|secret|token)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-]{16,}"
  message: "Possible hardcoded secret. Use env or a secret manager."
examples: []
source_pr_refs: []
body: |
  Credentials must not be committed. Flag assignments of long tokens
  to variables named key/secret/token.

  Skip planted corpora (evals/cases, testdata, fixtures, mocks, examples)
  and obvious placeholders: alphabet/keyboard runs, repeated characters,
  changeme / example / dummy / your-api-key-here. Those are not leaks.
